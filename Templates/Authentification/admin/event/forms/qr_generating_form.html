<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code - EasyEvent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card-custom { max-width: 500px; margin: 50px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-custom p-4">
            <h4 class="text-center text-primary mb-3">📲 Générateur de QR Code</h4>
            <p class="text-muted text-center small">Entrez la valeur pour télécharger le QR Code correspondant.</p>
            <hr>
            
            <form action="/telecharger-qrcode" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label for="qr_data" class="form-label fw-bold">Donnée du QR Code  :</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="qr_data" 
                        name="qr_data" 
                        placeholder="Ex: https://wa.me/243991152067" 
                        value="" 
                        required
                    >
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">
                        ⬇️ Générer & Télécharger le QR Code
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
