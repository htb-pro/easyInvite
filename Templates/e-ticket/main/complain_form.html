<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTicket - Finale Miss Katanga 2026</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    </head>
    <body>
    <div class="container py-5">

        <div id="formCard" class="card shadow-lg border-0">

            <div class="card-body p-5">

                <h3 class="text-center mb-4">
                Signaler un problème
                </h3>

                <form id="complaintForm">

                    <div class="mb-3">
                        <label class="form-label">Nom complet</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Adresse e-mail</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Événement concerné</label>

                        <select class="form-select">
                        <option>Sélectionner...</option>
                        <option>Festival Gospel</option>
                        <option>Concert Live</option>
                        <option>Mariage</option>
                        </select>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sujet</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Votre message</label>
                        <textarea class="form-control" rows="5"></textarea>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-success">
                        Envoyer la réclamation
                        </button>
                    </div>

                </form>

            </div>

        </div>

        <div id="successCard" style="display:none;" class="text-center py-5">
            <div class="display-1 text-success">
            ✔
            </div>

            <h2 class="mt-3">
            Réclamation envoyée !
            </h2>

            <p class="text-muted">
            Merci pour votre message.<br>
            Notre équipe vous répondra très prochainement.
            </p>

            <a href="/" class="btn btn-success">
            Retour à l'accueil
            </a>

        </div>

    </div>
<script>
const form = document.getElementById("complaintForm");

form.addEventListener("submit", function(e){

    e.preventDefault();

    // ici tu peux faire ton fetch() vers FastAPI

    document.getElementById("formCard").style.display = "none";

    document.getElementById("successCard").style.display = "block";

});
</script>
    </body>
    </html>
