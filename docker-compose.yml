version: '3.8'

services:
  # Base de données Redis
  redis:
    image: redis:7-alpine
    restart: always

  # Serveur Web FastAPI
  web:
    build: .
    command: uvicorn rooting:Apk --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  # Worker ARQ (Se lance tout seul !)
  worker:
    build: .
    command: arq worker.WorkerSettings
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis